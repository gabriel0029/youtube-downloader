services:
  app:
    build:
      context: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      YTDLP_PATH: /usr/local/bin/yt-dlp
      DOWNLOAD_DIR: /app/downloads
      MAX_DOWNLOAD_BYTES: ${MAX_DOWNLOAD_BYTES:-524288000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - downloads:/app/downloads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - private

  worker:
    build:
      context: .
    restart: unless-stopped
    init: true
    command: ["node", "--import", "tsx/esm", "worker/index.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      YTDLP_PATH: /usr/local/bin/yt-dlp
      DOWNLOAD_DIR: /app/downloads
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      MAX_DOWNLOAD_BYTES: ${MAX_DOWNLOAD_BYTES:-524288000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - downloads:/app/downloads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - private

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - private

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - private

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    security_opt:
      - no-new-privileges:false
    cap_drop:
      - ALL
    cap_add:
    - CHOWN
    - SETUID
    - SETGID
    - DAC_OVERRIDE
    - NET_BIND_SERVICE
    networks:
      - private

volumes:
  postgres_data:
  redis_data:
  downloads:

networks:
  private:
    driver: bridge
